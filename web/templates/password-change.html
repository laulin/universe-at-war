{{define "password-change.html"}}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changer le mot de passe — Universe At War</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="auth-shell">
    <section class="panel" aria-labelledby="page-title">
      <p class="eyebrow">Sécurité du compte</p>
      <h1 id="page-title">Choisir un nouveau mot de passe</h1>
      <p>Le secret initial ne peut être utilisé qu'avant cette étape.</p>
      {{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}
      <form method="post" action="/password/change">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label for="current-password">Mot de passe actuel</label>
        <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
        <label for="new-password">Nouveau mot de passe</label>
        <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
        <button type="submit">Enregistrer et continuer</button>
      </form>
    </section>
  </main>
</body>
</html>
{{end}}
