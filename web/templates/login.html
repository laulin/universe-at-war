{{define "title"}}Connexion{{end}}
{{define "content"}}
  <section class="panel" aria-labelledby="page-title">
    <p class="eyebrow">Centre de commandement</p>
    <h1 id="page-title">Universe At War</h1>
    <p>Connectez-vous pour administrer ou rejoindre cet univers.</p>
    {{if .Registered}}<p class="notice" role="status">Compte créé. Connectez-vous avec vos identifiants.</p>{{end}}
      <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <label for="username">Identifiant</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
    </form>
    {{if .RegistrationOpen}}<p><a href="/register">Créer un compte</a></p>{{end}}
  </section>
{{end}}
